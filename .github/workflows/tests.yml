name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m congress_signal_lab --input examples/synthetic.json --output output/demo.json --horizon 2
      - run: python scripts/audit_public_tree.py
      - run: python -m pip install .
      - run: congress-signal-lab --input examples/synthetic.json --output output/installed-demo.json --horizon 2
